<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siri Beauty World — Admin Panel</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #faf8f5; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 480px; }
    h2 { color: #8a2be2; margin-top: 0; text-align: center; }
    input, button, textarea { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
    button { background: #8a2be2; color: #fff; border: none; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.6; }
    .hidden { display: none; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 20px; }
    .item-card { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid #eee; }
    .item-card img, .item-card video { width: 100%; height: 100px; object-fit: cover; }
    .del-btn { position: absolute; top: 4px; right: 4px; background: rgba(220,53,69,0.9); color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Siri Beauty Admin</h2>

    <!-- LOGIN FORM -->
    <div id="loginSection">
      <input type="tel" id="phone" placeholder="Phone Number (9542356372)" value="9542356372" />
      <input type="password" id="password" placeholder="Password" />
      <button id="loginBtn" onclick="login()">Log In</button>
      <p id="loginMsg" style="color: red; text-align: center; font-size: 14px;"></p>
    </div>

    <!-- DASHBOARD -->
    <div id="adminSection" class="hidden">
      <h3>Upload Photo or Video</h3>
      <input type="file" id="mediaFile" accept="image/*,video/*" />
      <input type="text" id="caption" placeholder="Caption (optional)" />
      <button id="uploadBtn" onclick="uploadMedia()">Upload</button>
      <p id="uploadMsg" style="text-align: center; font-size: 14px;"></p>

      <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;" />
      <h3>Current Gallery</h3>
      <div id="gallery" class="gallery-grid"></div>
      <button onclick="logout()" style="background: #6c757d; margin-top: 20px;">Logout</button>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('token') || '';

    window.onload = () => {
      if (token) showAdmin();
    };

    async function login() {
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('loginMsg');
      msg.innerText = '';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });
        const data = await res.json();
        if (res.ok) {
          token = data.token;
          localStorage.setItem('token', token);
          showAdmin();
        } else {
          msg.innerText = data.error || 'Login failed';
        }
      } catch (err) {
        msg.innerText = 'Server connection error';
      }
    }

    function showAdmin() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('adminSection').classList.remove('hidden');
      loadGallery();
    }

    function logout() {
      localStorage.removeItem('token');
      token = '';
      location.reload();
    }

    async function uploadMedia() {
      const fileInput = document.getElementById('mediaFile');
      const caption = document.getElementById('caption').value;
      const msg = document.getElementById('uploadMsg');
      if (!fileInput.files[0]) return alert('Select a photo or video first');

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      formData.append('caption', caption);

      msg.innerText = 'Uploading...';
      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token },
          body: formData
        });
        const data = await res.json();
        if (res.ok) {
          msg.innerText = 'Uploaded successfully!';
          fileInput.value = '';
          document.getElementById('caption').value = '';
          loadGallery();
        } else {
          msg.innerText = data.error || 'Upload failed';
        }
      } catch (err) {
        msg.innerText = 'Upload error';
      }
    }

    async function loadGallery() {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = 'Loading...';
      try {
        const res = await fetch('/api/gallery');
        const items = await res.json();
        gallery.innerHTML = '';
        items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'item-card';
          const media = item.type === 'video' 
            ? `<video src="${item.url}" controls></video>`
            : `<img src="${item.url}" />`;
          div.innerHTML = `${media}<button class="del-btn" onclick="deleteItem('${item.id}')">X</button>`;
          gallery.appendChild(div);
        });
      } catch (err) {
        gallery.innerHTML = 'Failed to load items';
      }
    }

    async function deleteItem(id) {
      if (!confirm('Delete this item?')) return;
      await fetch('/api/gallery/' + id, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      loadGallery();
    }
  </script>
</body>
</html>
